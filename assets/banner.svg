<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <rect width="800" height="200" fill="#0a0e27"/>
  <path d="M0 50 H800 M0 100 H800 M0 150 H800 M100 0 V200 M200 0 V200 M300 0 V200 M400 0 V200 M500 0 V200 M600 0 V200 M700 0 V200" stroke="#00ffff" stroke-width="0.3" opacity="0.2"/>
  <g transform="translate(400,100)">
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="none" stroke="#00ffff" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12" fill="none" stroke="#ff00ff" stroke-width="1.5" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
    </polygon>
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff">PSK</text>
  </g>
  <g transform="translate(400,100)">
    <text font-family="monospace" font-size="10" fill="#00ff88"><animateMotion dur="10s" repeatCount="indefinite" path="M -250,0 a 250,60 0 1,1 500,0 a 250,60 0 1,1 -500,0"/>● Information Gathering</text>
    <text font-family="monospace" font-size="10" fill="#ff00ff"><animateMotion dur="10s" repeatCount="indefinite" begin="-1.25s" path="M -250,0 a 250,60 0 1,1 500,0 a 250,60 0 1,1 -500,0"/>● Network Scanning</text>
    <text font-family="monospace" font-size="10" fill="#00ffff"><animateMotion dur="10s" repeatCount="indefinite" begin="-2.5s" path="M -250,0 a 250,60 0 1,1 500,0 a 250,60 0 1,1 -500,0"/>● Web Security</text>
    <text font-family="monospace" font-size="10" fill="#00ff88"><animateMotion dur="10s" repeatCount="indefinite" begin="-3.75s" path="M -250,0 a 250,60 0 1,1 500,0 a 250,60 0 1,1 -500,0"/>● OSINT</text>
    <text font-family="monospace" font-size="10" fill="#ff00ff"><animateMotion dur="10s" repeatCount="indefinite" begin="-5.0s" path="M -250,0 a 250,60 0 1,1 500,0 a 250,60 0 1,1 -500,0"/>● Exploit Lab</text>
    <text font-family="monospace" font-size="10" fill="#00ffff"><animateMotion dur="10s" repeatCount="indefinite" begin="-6.25s" path="M -250,0 a 250,60 0 1,1 500,0 a 250,60 0 1,1 -500,0"/>● Cloud Security</text>
    <text font-family="monospace" font-size="10" fill="#00ff88"><animateMotion dur="10s" repeatCount="indefinite" begin="-7.5s" path="M -250,0 a 250,60 0 1,1 500,0 a 250,60 0 1,1 -500,0"/>● API Security</text>
    <text font-family="monospace" font-size="10" fill="#ff00ff"><animateMotion dur="10s" repeatCount="indefinite" begin="-8.75s" path="M -250,0 a 250,60 0 1,1 500,0 a 250,60 0 1,1 -500,0"/>● Reporting</text>
  </g>
  <rect x="0" y="0" width="800" height="1" fill="#00ffff" opacity="0.6">
    <animate attributeName="y" from="0" to="200" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
