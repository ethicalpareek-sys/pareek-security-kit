<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050815"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
    <linearGradient id="cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#00ffff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="250" fill="url(#bgG)"/>
  
  <!-- Cyber Grid -->
  <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M100 0 V250 M200 0 V250 M300 0 V250 M400 0 V250 M500 0 V250 M600 0 V250 M700 0 V250" stroke="#00ffff" stroke-width="0.3" opacity="0.15"/>

  <!-- Left Stats Bars (Animated) -->
  <g transform="translate(80, 50)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#00ff88">CPU LOAD</text>
    <rect x="0" y="10" width="60" height="8" fill="none" stroke="#00ffff" stroke-width="0.5"/>
    <rect x="0" y="10" width="45" height="8" fill="#00ffff" opacity="0.7">
      <animate attributeName="width" values="45;55;35;45" dur="3s" repeatCount="indefinite"/>
    </rect>
    
    <text x="0" y="35" font-family="monospace" font-size="10" fill="#00ff88">MEMORY</text>
    <rect x="0" y="45" width="60" height="8" fill="none" stroke="#00ffff" stroke-width="0.5"/>
    <rect x="0" y="45" width="30" height="8" fill="#ff00ff" opacity="0.7">
      <animate attributeName="width" values="30;50;40;30" dur="4s" repeatCount="indefinite"/>
    </rect>

    <text x="0" y="70" font-family="monospace" font-size="10" fill="#00ff88">THREAT LVL</text>
    <rect x="0" y="80" width="60" height="8" fill="none" stroke="#00ffff" stroke-width="0.5"/>
    <rect x="0" y="80" width="15" height="8" fill="#00ff88" opacity="0.9">
      <animate attributeName="width" values="15;25;10;15" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Right Stats Bars (Animated) -->
  <g transform="translate(660, 50)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#00ff88">FIREWALL</text>
    <rect x="0" y="10" width="60" height="8" fill="none" stroke="#00ffff" stroke-width="0.5"/>
    <rect x="0" y="10" width="55" height="8" fill="#00ff88" opacity="0.7">
      <animate attributeName="width" values="55;60;50;55" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    
    <text x="0" y="35" font-family="monospace" font-size="10" fill="#00ff88">PACKETS</text>
    <rect x="0" y="45" width="60" height="8" fill="none" stroke="#00ffff" stroke-width="0.5"/>
    <rect x="0" y="45" width="40" height="8" fill="#00ffff" opacity="0.7">
      <animate attributeName="width" values="40;20;50;40" dur="2.5s" repeatCount="indefinite"/>
    </rect>

    <text x="0" y="70" font-family="monospace" font-size="10" fill="#00ff88">ENCRYPTION</text>
    <rect x="0" y="80" width="60" height="8" fill="none" stroke="#00ffff" stroke-width="0.5"/>
    <rect x="0" y="80" width="58" height="8" fill="#ff00ff" opacity="0.9">
      <animate attributeName="width" values="58;60;55;58" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- CENTRAL 3D HACKING MACHINE (Reactor Core) -->
  <g transform="translate(400, 125)">
    <!-- Outer Rotating Ring 1 -->
    <ellipse cx="0" cy="0" rx="100" ry="35" fill="none" stroke="#00ffff" stroke-width="1.5" stroke-dasharray="10 5" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Outer Rotating Ring 2 (Opposite Direction) -->
    <ellipse cx="0" cy="0" rx="80" ry="25" fill="none" stroke="#ff00ff" stroke-width="1" stroke-dasharray="5 10" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Main 3D Core (Hexagon Base) -->
    <polygon points="0,-45 38,-22 38,22 0,45 -38,22 -38,-22" fill="none" stroke="url(#cyber)" stroke-width="2.5" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- Inner 3D Core (Rotating Opposite) -->
    <polygon points="0,-30 25,-12 25,12 0,30 -25,12 -25,-12" fill="none" stroke="#00ffff" stroke-width="1.5" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite"/>
    </polygon>

    <!-- Center Core Processor -->
    <rect x="-10" y="-10" width="20" height="20" fill="#050815" stroke="#ff00ff" stroke-width="1.5">
      <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Core Text -->
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#ffffff">CORE</text>

    <!-- Data Orbit Particles -->
    <circle cx="100" cy="0" r="3" fill="#00ffff" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-80" cy="0" r="2" fill="#ff00ff" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Header Text -->
  <text x="400" y="25" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#00ffff" filter="url(#glow)">
    PROJECT STATISTICS :: REACTOR CORE ONLINE
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- Bottom Status Text -->
  <text x="400" y="235" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ff88" opacity="0.8">
    [ STATUS: SECURE ]  [ ENCRYPTION: AES-256 ]  [ UPTIME: 99.99% ]
  </text>

  <!-- Corner Brackets -->
  <g stroke="#ff00ff" stroke-width="2" fill="none">
    <polyline points="10,10 10,30 M 10,10 30,10"/>
    <polyline points="790,10 790,30 M 790,10 770,10"/>
    <polyline points="10,240 10,220 M 10,240 30,240"/>
    <polyline points="790,240 790,220 M 790,240 770,240"/>
  </g>
</svg>
