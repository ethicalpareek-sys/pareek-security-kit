<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1a0000"/>
      <stop offset="60%" stop-color="#0a0000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="50%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#ff0000"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>

  <g font-family="monospace" font-size="12" fill="#ff0000" opacity="0.3">
    <text x="50" y="50">10001<animate attributeName="y" from="-50" to="450" dur="6s" repeatCount="indefinite"/></text>
    <text x="150" y="100">10110<animate attributeName="y" from="-50" to="450" dur="8s" repeatCount="indefinite" begin="1s"/></text>
    <text x="250" y="200">00101<animate attributeName="y" from="-50" to="450" dur="5s" repeatCount="indefinite" begin="2s"/></text>
    <text x="650" y="150">11010<animate attributeName="y" from="-50" to="450" dur="7s" repeatCount="indefinite" begin="0.5s"/></text>
    <text x="750" y="300">01001<animate attributeName="y" from="-50" to="450" dur="9s" repeatCount="indefinite" begin="1.5s"/></text>
    <text x="550" y="50">11100<animate attributeName="y" from="-50" to="450" dur="6.5s" repeatCount="indefinite" begin="2.5s"/></text>
  </g>

  <g transform="translate(400, 200)">
    <ellipse cx="0" cy="0" rx="200" ry="60" fill="none" stroke="#ff0000" stroke-width="1.5" stroke-dasharray="10 5" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="150" ry="40" fill="none" stroke="#ff4444" stroke-width="1" stroke-dasharray="5 10" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="100" ry="25" fill="none" stroke="#ff0000" stroke-width="2" stroke-dasharray="8 4" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g transform="translate(400, 200)" filter="url(#strongGlow)">
    <path d="M -60,-60 Q -60,-120 0,-140 Q 60,-120 60,-60 Q 60,20 0,60 Q -60,20 -60,-60 Z" fill="#111111" stroke="#ff0000" stroke-width="2"/>
    <path d="M -40,-70 Q -40,-110 0,-125 Q 40,-110 40,-70 Q 40,-20 0,10 Q -40,-20 -40,-70 Z" fill="#050505"/>
    <polygon points="-25,-65 -10,-60 -10,-45" fill="#ff0000">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="25,-65 10,-60 10,-45" fill="#ff0000">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="-20,-45 -5,-40 -5,-30" fill="#ff4444" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="20,-45 5,-40 5,-30" fill="#ff4444" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <g transform="translate(400, 200)" filter="url(#glow)">
    <circle cx="180" cy="0" r="4" fill="#ff0000">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-140" cy="0" r="3" fill="#ff4444">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="0" r="2" fill="#ff0000">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="400" y="50" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#ff0000" filter="url(#strongGlow)">
    CYBER SENTINEL
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </text>

  <text x="400" y="380" text-anchor="middle" font-family="monospace" font-size="12" fill="#ff4444" opacity="0.8">
    [ SYSTEM ONLINE ]  [ FIREWALL ACTIVE ]  [ TRACKING ENABLED ]
  </text>

  <g stroke="#ff0000" stroke-width="2" fill="none" filter="url(#glow)">
    <polyline points="20,20 20,50 M 20,20 50,20"/>
    <polyline points="780,20 780,50 M 780,20 750,20"/>
    <polyline points="20,380 20,350 M 20,380 50,380"/>
    <polyline points="780,380 780,350 M 780,380 750,380"/>
  </g>
</svg>
