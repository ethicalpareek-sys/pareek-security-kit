<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1a0000"/>
      <stop offset="60%" stop-color="#050000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="redCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#00ffff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="strongGlow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="900" height="450" fill="url(#bgGrad)"/>
  <path d="M0 75 H900 M0 150 H900 M0 225 H900 M0 300 H900 M0 375 H900 M75 0 V450 M150 0 V450 M225 0 V450 M300 0 V450 M375 0 V450 M450 0 V450 M525 0 V450 M600 0 V450 M675 0 V450 M750 0 V450 M825 0 V450" stroke="#ff0000" stroke-width="0.3" opacity="0.15"/>

  <g font-family="monospace" font-size="14" fill="#00ffff" opacity="0.4">
    <text x="60" y="-20">011001<animate attributeName="y" from="-20" to="470" dur="6s" repeatCount="indefinite"/></text>
    <text x="200" y="-50">101100<animate attributeName="y" from="-50" to="470" dur="8s" repeatCount="indefinite" begin="1.5s"/></text>
    <text x="700" y="-30">100101<animate attributeName="y" from="-30" to="470" dur="7s" repeatCount="indefinite" begin="0.5s"/></text>
    <text x="800" y="-60">110010<animate attributeName="y" from="-60" to="470" dur="9s" repeatCount="indefinite" begin="2s"/></text>
    <text x="350" y="-40">001101<animate attributeName="y" from="-40" to="470" dur="5.5s" repeatCount="indefinite" begin="1s"/></text>
    <text x="550" y="-70">111000<animate attributeName="y" from="-70" to="470" dur="7.5s" repeatCount="indefinite" begin="3s"/></text>
  </g>

  <g transform="translate(450, 225)">
    <ellipse cx="0" cy="0" rx="220" ry="60" fill="none" stroke="#ff0000" stroke-width="2" stroke-dasharray="15 8" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="160" ry="40" fill="none" stroke="#00ffff" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="100" ry="25" fill="none" stroke="#ff0000" stroke-width="2.5" stroke-dasharray="10 5" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g transform="translate(450, 200)" filter="url(#strongGlow)">
    <path d="M -80,-60 Q -80,-140 0,-160 Q 80,-140 80,-60 Q 80,40 0,80 Q -80,40 -80,-60 Z" fill="#0a0000" stroke="#ff0000" stroke-width="2.5"/>
    <path d="M -55,-70 Q -55,-130 0,-145 Q 55,-130 55,-70 Q 55,-10 0,20 Q -55,-10 -55,-70 Z" fill="#000000" stroke="#00ffff" stroke-width="1.5" opacity="0.8"/>
    <path d="M -35,-75 Q -35,-110 0,-120 Q 35,-110 35,-75 Q 35,-30 0,-5 Q -35,-30 -35,-75 Z" fill="#050505"/>
    
    <polygon points="-28,-60 -15,-55 -15,-40" fill="#ff0000">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="28,-60 15,-55 15,-40" fill="#ff0000">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="-22,-45 -10,-40 -10,-32" fill="#00ffff" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="22,-45 10,-40 10,-32" fill="#00ffff" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.2s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <g transform="translate(450, 200)" filter="url(#glow)">
    <circle cx="200" cy="0" r="5" fill="#ff0000"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="-160" cy="0" r="4" fill="#00ffff"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="0" r="3" fill="#ff0000"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <g filter="url(#strongGlow)">
    <text x="450" y="60" text-anchor="middle" font-family="'Courier New', monospace" font-size="36" font-weight="bold" fill="#ff0000">
      ETHICAL HACKING
      <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="90" text-anchor="middle" font-family="monospace" font-size="14" fill="#00ffff" opacity="0.8">
      SYSTEM ONLINE :: UNAUTHORIZED ACCESS DETECTED
    </text>
  </g>

  <text x="450" y="430" text-anchor="middle" font-family="monospace" font-size="14" fill="#ff0000" opacity="0.9">
    [ FIREWALL: ACTIVE ]  [ TRACKING: ENABLED ]  [ ENCRYPTION: AES-256 ]
  </text>

  <g stroke="#00ffff" stroke-width="2" fill="none" filter="url(#glow)">
    <polyline points="20,20 20,50 M 20,20 50,20"/>
    <polyline points="880,20 880,50 M 880,20 850,20"/>
    <polyline points="20,430 20,400 M 20,430 50,430"/>
    <polyline points="880,430 880,400 M 880,430 850,430"/>
  </g>
</svg>
